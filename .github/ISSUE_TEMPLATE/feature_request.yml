name: Feature request
description: An idea for how GhostClick should test, filter or report.
title: "[Idea] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
      placeholder: "Example: I use two mice and want a separate threshold for each."
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you would like
      description: Describe the behavior. Sketches and screenshots are welcome.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Recorder (click test)
        - Interval histogram
        - System-wide filter
        - Hold test
        - Switch wear meter
        - Evidence report
        - Website
        - Other
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you tried
      description: Other tools, Windows settings, or workarounds.
