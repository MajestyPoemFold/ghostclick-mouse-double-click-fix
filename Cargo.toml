[workspace]
resolver = "3"
members = ["crates/*", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["OWNER"]
repository = "https://github.com/OWNER/ghostclick-mouse-double-click-fix"

[workspace.dependencies]
ghostclick-core = { path = "crates/ghostclick-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
